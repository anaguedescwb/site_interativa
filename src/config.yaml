site:
  name: Interativa Impressoras
  site: 'https://impressoras.interativa.inf.br'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: null

# Default SEO metadata
metadata:
  title:
    default: Outsourcing e locação de impressoras em Curitiba
    template: '%s — Interativa Impressoras'
  description: 'Outsourcing e locação de impressoras em Curitiba desde 1995. Gestão completa, suprimentos e assistência técnica com custo por página. Fale com um especialista.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Interativa Impressoras
    images:
      - url: '~/assets/images/hero-impressora.png'
        width: 546
        height: 358
    type: website

i18n:
  language: pt-BR
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'light:only' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
